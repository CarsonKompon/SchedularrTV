<!doctype html>
<!--
  A radio station's picture, drawn at 1280x720 for the hidden browser: the song (cover, title, artist), its lyrics,
  what's next, a clock and a message, in one of five looks. The visualizer is NOT drawn here: the stream draws it from
  the sound, in step with it, into the box given in the settings (cfg.vis), so that box is left clear.
  What's playing comes from now.json, polled every second; everything from it is set as text, never as HTML.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<title>Radio</title>
<style>
  :root { --accent: #ff5c8a; --bgc: #101828; --ink: #ffffff; --soft: rgba(255,255,255,.72); --faint: rgba(255,255,255,.4); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink); position: relative; }
  .hidden { display: none !important; }

  /* Background */
  #bg { position: absolute; inset: 0; background: var(--bgc); overflow: hidden; }
  #bg img { position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; filter: blur(42px) brightness(.45) saturate(1.3); transition: opacity 1.2s; }
  #bg .gradient { position: absolute; inset: -30%; background:
      radial-gradient(circle at 25% 30%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 45%),
      radial-gradient(circle at 75% 70%, color-mix(in srgb, var(--accent) 35%, #3a0ca3), transparent 50%), var(--bgc);
    animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(-5%, -4%) rotate(0); } to { transform: translate(5%, 4%) rotate(12deg); } }
  #bg .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55)); }

  /* Common pieces */
  .art { position: absolute; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.08); box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art .none { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 96px; color: var(--faint); }
  #station { position: absolute; top: 28px; left: 40px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 20px; color: var(--soft); }
  #station::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: 2px; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #clock { position: absolute; top: 24px; right: 40px; font-size: 26px; font-weight: 600; color: var(--soft); font-variant-numeric: tabular-nums; }
  #title { font-weight: 800; line-height: 1.08; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #artist { color: var(--accent); font-weight: 600; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { color: var(--soft); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #progress { position: absolute; height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
  #progress div { height: 100%; width: 0; background: var(--accent); }
  #next { position: absolute; font-size: 18px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next b { color: var(--accent); font-weight: 700; margin-right: 8px; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
  #lyrics { position: absolute; overflow: hidden; }
  #lyrics .line { transition: color .35s, opacity .35s, transform .35s; color: var(--faint); }
  #lyrics .line.now { color: var(--ink); }
  #lyrics .line.past { opacity: .45; }
  #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 0; overflow: hidden; }
  #ticker span { position: absolute; white-space: nowrap; padding-left: 100%; animation: scroll linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  #problem { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 26px; color: var(--soft); }
  #vis { position: absolute; pointer-events: none; }
  .preview #vis { outline: 2px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: -2px; }
  .preview #vis::after { content: "Visualizer"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }

  /* Now playing */
  .p-NowPlaying #art { left: 80px; top: 100px; width: 420px; height: 420px; }
  .p-NowPlaying #info { position: absolute; left: 550px; top: 110px; width: 660px; }
  .p-NowPlaying #title { font-size: 52px; }
  .p-NowPlaying #artist { font-size: 30px; }
  .p-NowPlaying #album { font-size: 20px; }
  .p-NowPlaying #lyrics { left: 550px; top: 300px; width: 660px; height: 200px; font-size: 26px; line-height: 40px; }
  .p-NowPlaying #progress { left: 550px; top: 515px; width: 660px; }
  .p-NowPlaying #next { left: 80px; top: 540px; width: 1130px; }
  .p-NowPlaying.no-art #info, .p-NowPlaying.no-art #lyrics, .p-NowPlaying.no-art #progress { left: 80px; width: 1130px; }

  /* Karaoke */
  .p-Karaoke #art { left: 40px; top: 70px; width: 96px; height: 96px; border-radius: 10px; }
  .p-Karaoke #info { position: absolute; left: 156px; top: 76px; width: 900px; }
  .p-Karaoke.no-art #info { left: 40px; }
  .p-Karaoke #title { font-size: 30px; -webkit-line-clamp: 1; }
  .p-Karaoke #artist { font-size: 22px; margin-top: 4px; }
  .p-Karaoke #album { display: none; }
  .p-Karaoke #lyrics { left: 80px; right: 80px; top: 190px; height: 390px; text-align: center; font-size: 34px; line-height: 64px; }
  .p-Karaoke #lyrics .line.now { font-size: 54px; font-weight: 800; color: var(--ink); text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 70%, transparent); }
  .p-Karaoke #progress { left: 40px; right: 40px; top: 585px; }
  .p-Karaoke #next { right: 40px; top: 120px; width: 420px; text-align: right; }

  /* Vinyl */
  .p-Vinyl #record { position: absolute; left: 430px; top: 70px; width: 420px; height: 420px; border-radius: 50%;
    background: repeating-radial-gradient(circle, #111 0 2px, #1c1c1c 2px 4px); box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 6px #0a0a0a;
    animation: spin 6s linear infinite; }
  .p-Vinyl #record::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 30deg, transparent 0 20%, rgba(255,255,255,.07) 25%, transparent 30% 70%, rgba(255,255,255,.06) 75%, transparent 80%); }
  .p-Vinyl #art { left: 570px; top: 210px; width: 140px; height: 140px; border-radius: 50%; animation: spin 6s linear infinite; box-shadow: none; z-index: 2; }
  .p-Vinyl #art::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #0b0b0b; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .p-Vinyl #info { position: absolute; left: 140px; right: 140px; top: 500px; text-align: center; }
  .p-Vinyl #title { font-size: 34px; -webkit-line-clamp: 1; }
  .p-Vinyl #artist { font-size: 22px; margin-top: 4px; }
  .p-Vinyl #album { display: none; }
  .p-Vinyl #lyrics { left: 140px; right: 140px; top: 24px; height: 40px; text-align: center; font-size: 24px; line-height: 40px; }
  .p-Vinyl #lyrics .line:not(.now) { display: none; }
  .p-Vinyl #progress { display: none; }
  .p-Vinyl #next { left: 40px; bottom: 24px; width: 600px; }
  .p-Vinyl #station { top: 680px; left: auto; right: 40px; }
  .p-Vinyl #clock { top: 24px; }

  /* Retro FM */
  .p-RetroFm #bg { background: #07090c; }
  .p-RetroFm #bg img, .p-RetroFm #bg .gradient { opacity: .18; }
  .p-RetroFm #panel { position: absolute; left: 60px; top: 50px; right: 60px; bottom: 50px; border-radius: 18px;
    background: linear-gradient(180deg, #14181f, #0b0e12); box-shadow: inset 0 0 0 2px #2a313c, 0 20px 60px rgba(0,0,0,.7); }
  .p-RetroFm #lcd { position: absolute; left: 120px; top: 90px; width: 1040px; height: 180px; border-radius: 10px; background: #0d1a12;
    box-shadow: inset 0 0 30px rgba(0,0,0,.8); font-family: "Consolas", "Courier New", monospace; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
  .p-RetroFm #station { position: absolute; left: 150px; top: 112px; font-family: "Consolas", "Courier New", monospace; color: var(--accent); text-shadow: 0 0 10px var(--accent); font-size: 26px; }
  .p-RetroFm #station::before { display: none; }
  .p-RetroFm #clock { right: 150px; top: 108px; font-family: "Consolas", "Courier New", monospace; color: var(--accent); text-shadow: 0 0 10px var(--accent); font-size: 30px; }
  .p-RetroFm #info { position: absolute; left: 150px; top: 160px; width: 980px; font-family: "Consolas", "Courier New", monospace; color: var(--accent); text-shadow: 0 0 12px var(--accent); }
  .p-RetroFm #title { font-size: 46px; -webkit-line-clamp: 1; text-transform: uppercase; }
  .p-RetroFm #artist { font-size: 26px; color: var(--accent); opacity: .8; text-transform: uppercase; }
  .p-RetroFm #album { display: none; }
  .p-RetroFm #art { right: 150px; top: 540px; width: 110px; height: 110px; border-radius: 8px; }
  .p-RetroFm #lyrics { left: 150px; top: 545px; width: 860px; height: 44px; font-size: 26px; line-height: 44px; font-family: "Consolas", "Courier New", monospace; }
  .p-RetroFm #lyrics .line:not(.now) { display: none; }
  .p-RetroFm #lyrics .line.now { color: #e8ffe8; }
  .p-RetroFm #progress { left: 150px; top: 530px; width: 860px; height: 4px; }
  .p-RetroFm #next { left: 150px; top: 600px; width: 860px; font-family: "Consolas", "Courier New", monospace; font-size: 18px; }
  .p-RetroFm #vis { border-radius: 8px; box-shadow: inset 0 0 0 2px #2a313c; }

  /* Minimal */
  .p-Minimal #bg img { inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); filter: blur(6px) brightness(.55); }
  .p-Minimal #bg .shade { background: linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.1) 70%); }
  .p-Minimal #art { display: none; }
  .p-Minimal #info { position: absolute; left: 60px; top: 600px; width: 900px; }
  .p-Minimal #title { font-size: 40px; -webkit-line-clamp: 1; }
  .p-Minimal #artist { font-size: 24px; margin-top: 2px; }
  .p-Minimal #album { display: none; }
  .p-Minimal #lyrics { left: 60px; top: 120px; width: 900px; height: 300px; font-size: 30px; line-height: 50px; }
  .p-Minimal #progress { left: 60px; top: 690px; width: 560px; height: 3px; }
  .p-Minimal #next { right: 40px; top: 690px; width: 560px; text-align: right; }

  /* A message along the bottom pushes nothing: it sits over the bottom edge in its own bar. */
  body.with-ticker #ticker { height: 40px; background: rgba(0,0,0,.55); border-top: 2px solid var(--accent); }
  body.with-ticker #ticker span { line-height: 38px; font-size: 20px; }
</style>
</head>
<body>
<div id="bg"><div class="gradient hidden"></div><img id="bg-art" alt="" class="hidden"><div class="shade"></div></div>
<div id="panel" class="hidden"></div>
<div id="lcd" class="hidden"></div>
<div id="record" class="hidden"></div>
<div id="station"></div>
<div id="clock"></div>
<div id="art" class="art"><img alt="" class="hidden"><div class="none">♪</div></div>
<div id="info"><div id="title"></div><div id="artist"></div><div id="album"></div></div>
<div id="lyrics"></div>
<div id="progress"><div></div></div>
<div id="next"></div>
<div id="problem" class="hidden"></div>
<div id="vis"></div>
<div id="ticker"><span></span></div>

<script>window.RADIO = __CONFIG__;</script>
<script>
(() => {
  "use strict";
  const base = "/plugins/radio";
  let cfg = window.RADIO;
  let now = null, offset = 0, songKey = "", lyricsKey = "";
  const $ = id => document.getElementById(id);

  function applyConfig() {
    const root = document.documentElement.style;
    root.setProperty("--accent", cfg.accent);
    root.setProperty("--bgc", cfg.backgroundColor);
    document.body.className = `p-${cfg.preset}` + (cfg.preview ? " preview" : "") + (cfg.showArt ? "" : " no-art") + (cfg.message ? " with-ticker" : "");
    $("panel").classList.toggle("hidden", cfg.preset !== "RetroFm");
    $("lcd").classList.toggle("hidden", cfg.preset !== "RetroFm");
    $("record").classList.toggle("hidden", cfg.preset !== "Vinyl");
    $("art").classList.toggle("hidden", !cfg.showArt);
    $("lyrics").classList.toggle("hidden", !cfg.showLyrics);
    $("next").classList.toggle("hidden", !cfg.showUpNext);
    $("clock").classList.toggle("hidden", !cfg.showClock);
    $("station").textContent = cfg.name;
    $("bg").querySelector(".gradient").classList.toggle("hidden", cfg.background !== "Gradient");
    const vis = $("vis");
    if (cfg.vis) {
      Object.assign(vis.style, { display: "block", left: cfg.vis.x + "px", top: cfg.vis.y + "px", width: cfg.vis.width + "px", height: cfg.vis.height + "px" });
    } else {
      vis.style.display = "none";
    }
    const ticker = $("ticker").querySelector("span");
    ticker.textContent = cfg.message || "";
    requestAnimationFrame(() => { ticker.style.animationDuration = Math.max(10, ticker.scrollWidth / 110) + "s"; });
    songKey = ""; lyricsKey = "";
    render();
  }

  async function poll() {
    try {
      const response = await fetch(`${base}/now/${encodeURIComponent(cfg.id)}.json${cfg.preview ? "?preview=true" : ""}`, { cache: "no-store" });
      if (response.ok) {
        now = await response.json();
        offset = now.serverTime - Date.now();
      }
    } catch { /* keep what we have */ }
    render();
  }

  const position = () => now && now.song ? (Date.now() + offset) - now.startedAt + (cfg.lyricsOffsetMs || 0) : 0;

  function setArt(url) {
    const img = $("art").querySelector("img"), bg = $("bg-art");
    for (const element of [img, bg]) {
      if (url) {
        if (element.getAttribute("src") !== url) element.src = url;
        element.classList.remove("hidden");
      } else {
        element.removeAttribute("src");
        element.classList.add("hidden");
      }
    }
    if (cfg.background !== "BlurredArt" && cfg.preset !== "Minimal" && cfg.preset !== "RetroFm") bg.classList.add("hidden");
    $("art").querySelector(".none").classList.toggle("hidden", !!url);
  }

  function render() {
    const song = now && now.song;
    const problem = now && now.problem;
    $("problem").classList.toggle("hidden", !problem);
    $("problem").textContent = problem || "";
    const key = song ? `${song.title}|${song.artist}|${song.art || ""}` : "";
    if (key !== songKey) {
      songKey = key;
      $("title").textContent = song ? song.title : (problem ? "" : cfg.name);
      $("artist").textContent = song ? song.artist : "";
      $("album").textContent = song ? [song.album, song.year].filter(Boolean).join(" · ") : "";
      setArt(song ? song.art : null);
      lyricsKey = "";
    }
    const next = now && now.next;
    $("next").replaceChildren();
    if (next && cfg.showUpNext) {
      const label = document.createElement("b"); label.textContent = "Up next";
      $("next").append(label, document.createTextNode(next.artist ? `${next.title} — ${next.artist}` : next.title));
    }
    renderLyrics(song);
    renderProgress(song);
  }

  function renderLyrics(song) {
    const box = $("lyrics");
    const lines = song && song.lyrics ? song.lyrics : [];
    const key = songKey + "|" + lines.length;
    if (key !== lyricsKey) {
      lyricsKey = key;
      box.replaceChildren(...lines.map(line => { const div = document.createElement("div"); div.className = "line"; div.textContent = line.text || "♪"; return div; }));
      box.scrollTop = 0;
    }
    if (!lines.length) return;
    const at = position();
    const synced = lines.every(line => line.at !== null && line.at !== undefined);
    let current = -1;
    if (synced) {
      for (let i = 0; i < lines.length; i++) { if (lines[i].at <= at) current = i; else break; }
    } else if (song.durationMs) {
      current = Math.min(lines.length - 1, Math.floor(at / song.durationMs * lines.length));
    }
    const children = box.children;
    for (let i = 0; i < children.length; i++) {
      children[i].classList.toggle("now", i === current);
      children[i].classList.toggle("past", i < current);
    }
    // Keep the current line in view, a little above the middle.
    const target = current >= 0 ? children[current] : null;
    if (target) {
      const wanted = target.offsetTop - box.clientHeight * 0.4 + target.clientHeight / 2;
      box.scrollTop = Math.max(0, wanted);
    }
  }

  function renderProgress(song) {
    const bar = $("progress");
    if (!song || !song.durationMs) { bar.classList.add("hidden"); return; }
    bar.classList.remove("hidden");
    bar.firstElementChild.style.width = Math.min(100, Math.max(0, position() / song.durationMs * 100)) + "%";
  }

  function clock() {
    const date = new Date();
    $("clock").textContent = date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  window.addEventListener("message", event => {
    if (event.data && event.data.type === "radio-settings") {
      cfg = Object.assign({}, cfg, event.data.settings, { preview: true });
      applyConfig();
      poll();
    }
  });

  applyConfig();
  clock();
  poll();
  setInterval(poll, 1000);
  setInterval(clock, 1000);
  setInterval(() => { renderLyrics(now && now.song); renderProgress(now && now.song); }, 250);
})();
</script>
</body>
</html>
